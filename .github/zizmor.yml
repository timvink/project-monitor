rules:
  artipacked:
    ignore:
      # `ghp-import -p` pushes gh-pages with the checkout's credentials.
      - build.yml
  excessive-permissions:
    ignore:
      # The gh-pages push relies on the repository's default token permissions.
      - build.yml
  dependabot-cooldown:
    config:
      # Monthly grouped updates; 3 days is enough to catch yanked releases.
      days: 3
